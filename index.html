<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WEST. 音楽日記</title>
  <meta name="description" content="今日聴いた WEST. の曲と一緒に、日々を残す音楽日記">
  <meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12141b" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="WEST.日記">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>
  <div id="bg-layer" aria-hidden="true"></div>
  <header class="site-header">
    <div class="site-heading">
      <h1 class="site-title">WEST. 音楽日記</h1>
      <p class="site-subtitle">今日聴いた WEST. の曲と一緒に、日々を残そう</p>
    </div>
    <button type="button" id="settings-btn" class="settings-btn" aria-label="配色・背景の設定" title="配色・背景の設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <div class="notice-wrap"><p id="notice" class="notice" role="status" hidden></p></div>

  <main class="container">
    <section class="panel form-panel" aria-labelledby="form-heading">
      <h2 id="form-heading" class="panel-title">新しい日記</h2>
      <form id="entry-form" novalidate>
        <div class="form-row">
          <label for="date">日付</label>
          <input type="date" id="date" required>
        </div>
        <div class="form-row">
          <label for="song">曲名</label>
          <input type="text" id="song" list="song-options" maxlength="100" autocomplete="off" placeholder="例：ええじゃないか" required>
          <datalist id="song-options"></datalist>
        </div>
        <div class="form-row">
          <label for="album">作品名（アルバム / シングル）</label>
          <input type="text" id="album" list="album-options" maxlength="100" autocomplete="off" placeholder="曲名を選ぶと自動で入ります" required>
          <datalist id="album-options"></datalist>
          <p id="album-hint" class="hint" aria-live="polite"></p>
        </div>
        <fieldset class="category-field">
          <legend>種別</legend>
          <label class="radio"><input type="radio" id="cat-album" name="category" value="album" checked> アルバム</label>
          <label class="radio"><input type="radio" id="cat-single" name="category" value="single"> シングル</label>
        </fieldset>
        <div class="form-row">
          <label for="lyric">好きな歌詞（任意）</label>
          <textarea id="lyric" class="lyric-input" rows="2" maxlength="200" placeholder="心に残った一節を短く"></textarea>
        </div>
        <div class="form-row">
          <label for="memo">日記・メモ</label>
          <textarea id="memo" rows="4" maxlength="2000" placeholder="今日の出来事や、曲を聴いて感じたこと"></textarea>
        </div>
        <p id="form-error" class="form-error" role="alert" hidden></p>
        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">
            <span class="btn-label">保存</span>
          </button>
          <button type="button" id="cancel-btn" class="btn btn-secondary" hidden>キャンセル</button>
        </div>
      </form>
    </section>

    <section class="panel" aria-label="日記一覧">
      <div class="tabs" role="tablist">
        <button type="button" id="tab-timeline" class="tab is-active" role="tab" aria-selected="true" data-view="timeline">時系列</button>
        <button type="button" id="tab-group" class="tab" role="tab" aria-selected="false" data-view="group">作品別</button>
        <button type="button" id="tab-songs" class="tab" role="tab" aria-selected="false" data-view="songs">曲をさがす</button>
      </div>
      <div class="filters">
        <input type="search" id="search" class="search-input" placeholder="曲名・作品名・歌詞・本文で検索" aria-label="キーワード検索">
        <select id="category-filter" class="category-filter" aria-label="種別で絞り込み">
          <option value="all">すべて</option>
          <option value="album">アルバムのみ</option>
          <option value="single">シングルのみ</option>
        </select>
      </div>
      <p id="count" class="count" hidden></p>
      <div id="entry-list" class="entry-list" aria-live="polite">
        <div class="empty"><span class="empty-icon">♪</span><p>日記を読み込んでいます…</p></div>
      </div>
      <div class="data-panel">
        <h2 class="data-title">バックアップ・引っ越し</h2>
        <p class="data-note">日記はこの端末の中だけに保存されています。機種変更やもしものときのために、ときどき書き出しておきましょう。</p>
        <div class="data-actions">
          <button type="button" id="export-btn" class="btn btn-small">日記を書き出す</button>
          <button type="button" id="import-btn" class="btn btn-small">日記を読み込む</button>
          <input type="file" id="import-file" accept=".json,application/json" hidden>
        </div>
        <p id="backup-status" class="backup-status"></p>
        <p id="data-message" class="data-message" role="status"></p>
      </div>
    </section>
  </main>
  <button type="button" id="to-top" class="to-top" aria-label="いちばん上へ戻る" title="いちばん上へ戻る" tabindex="-1">↑</button>
  <audio id="player" preload="none"></audio>

  <dialog id="settings" class="settings-dialog" aria-labelledby="settings-heading">
    <div class="settings-head">
      <h2 id="settings-heading" tabindex="-1" autofocus>配色・背景</h2>
      <button type="button" class="btn btn-small" data-close>閉じる</button>
    </div>
    <div class="settings-body">
      <section class="settings-section">
        <h3>プリセット</h3>
        <div id="preset-list" class="swatches"></div>
      </section>

      <section class="settings-section">
        <h3>テーマカラー</h3>
        <label class="color-row"><input type="color" id="accent-input"> 好きな色を選ぶ</label>
        <p class="settings-note">ボタンや選択中のタブなどの色です。文字が読みにくい色は、自動で読みやすい明るさに調整します。</p>
      </section>

      <section class="settings-section">
        <h3>表示モード</h3>
        <div class="segmented" role="radiogroup" aria-label="表示モード">
          <label><input type="radio" name="mode" value="auto"><span>端末に合わせる</span></label>
          <label><input type="radio" name="mode" value="light"><span>ライト</span></label>
          <label><input type="radio" name="mode" value="dark"><span>ダーク</span></label>
        </div>
      </section>

      <section class="settings-section">
        <h3>背景</h3>
        <div class="segmented is-wrap" role="radiogroup" aria-label="背景">
          <label><input type="radio" name="bg" value="default"><span>標準</span></label>
          <label><input type="radio" name="bg" value="tint"><span>テーマカラー</span></label>
          <label><input type="radio" name="bg" value="color"><span>単色</span></label>
          <label><input type="radio" name="bg" value="gradient"><span>グラデーション</span></label>
          <label><input type="radio" name="bg" value="image"><span>写真</span></label>
        </div>
        <div class="bg-options" data-bg-panel="color" hidden>
          <label class="color-row"><input type="color" id="bg-color-input"> 背景の色</label>
        </div>
        <div class="bg-options" data-bg-panel="gradient" hidden>
          <label class="color-row"><input type="color" id="bg-grad-a"> 上の色</label>
          <label class="color-row"><input type="color" id="bg-grad-b"> 下の色</label>
        </div>
        <div class="bg-options" data-bg-panel="image" hidden>
          <div id="bg-preview" class="bg-preview" hidden></div>
          <div class="data-actions">
            <button type="button" id="bg-pick" class="btn btn-small">写真を選ぶ</button>
            <button type="button" id="bg-remove" class="btn btn-small btn-danger" hidden>写真を削除</button>
            <input type="file" id="bg-file" accept="image/*" hidden>
          </div>
          <label class="range-row" id="bg-fade-row">写真を薄く <input type="range" id="bg-fade" min="0" max="0.7" step="0.05"></label>
          <p id="bg-error" class="settings-error" role="alert" hidden></p>
        </div>
      </section>
      <p class="settings-note">配色と背景の写真は、「日記を書き出す」のファイルにも含まれます。</p>
    </div>
    <div class="settings-foot">
      <button type="button" id="theme-reset" class="btn btn-small">標準に戻す</button>
      <button type="button" class="btn btn-primary" data-close>完了</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
